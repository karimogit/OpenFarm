name: Validate guides

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate all content against the JSON Schemas in schema/
        run: npm run validate
      - name: Check that every image URL resolves (HEAD 200)
        run: npm run check:images
      - name: Build site and search index
        run: npx @11ty/eleventy && npx pagefind --site _site
