name: Validate guides

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate guide frontmatter against schema/guide.schema.json
        run: npm run validate
      - name: Build site
        run: npx @11ty/eleventy
