name: Validate guides

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate all content against the JSON Schemas in schema/
        run: npm run validate
      - name: Check new or changed image URLs
        env:
          CHECK_IMAGES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:images -- --changed
      - name: Build site and search index
        run: npx @11ty/eleventy && npx pagefind --site _site
